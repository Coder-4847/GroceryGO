# One-click Render blueprint. In the Render dashboard: New > Blueprint, point at
# this repo. Render builds the Dockerfile in ./backend.
services:
  - type: web
    name: grocerygo-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HEADLESS
        value: "0"
      - key: BROWSER_CHANNEL
        value: chrome
      - key: CORS_ORIGINS
        sync: false # set to your GitHub Pages origin, e.g. https://<user>.github.io
      - key: SCRAPER_CONCURRENCY
        value: "2" # free tier has ~0.5 CPU / 512MB — keep this low
      - key: CACHE_TTL_MS
        value: "1800000"
