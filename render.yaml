# Render blueprint. Must live at the repo ROOT (Render only looks here).
# In the Render dashboard: New > Blueprint, point it at this repo.
services:
  - type: web
    name: grocerygo-api
    runtime: docker
    # Paths are relative to the repo root. The backend is self-contained in ./backend.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: node src/server.js
    plan: free
    region: frankfurt # closest free region to the UAE
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HEADLESS
        value: "0" # must stay headed — Carrefour/Noon block headless
      - key: BROWSER_CHANNEL
        value: chromium
      - key: SCRAPER_CONCURRENCY
        value: "1" # 512 MB only fits one headed browser tab at a time
      - key: SCRAPER_TIMEOUT_MS
        value: "40000" # room for a slow cold browser start on a tiny instance
      - key: NODE_OPTIONS
        value: "--max-old-space-size=192"
      - key: CACHE_TTL_MS
        value: "1800000" # 30 min
      - key: CORS_ORIGINS
        # Optional: any https://*.github.io origin is already allowed by default.
        # Set this only for a custom domain. `sync: false` = edit it in the dashboard.
        sync: false
